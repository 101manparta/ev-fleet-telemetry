[package]
name = "ev-consumer"
version = "0.1.0"
edition = "2021"

[dependencies]
rdkafka = { version = "0.31", features = ["cmake-build"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
dotenvy = "0.15"